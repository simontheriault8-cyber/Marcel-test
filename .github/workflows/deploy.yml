name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-main:
    name: Déploiement Production (main)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation des dépendances
        run: npm install

      - name: Build de l'application
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Préparer les fichiers SPA et nojekyll
        run: |
          if [ -d "dist/browser" ]; then
            DEPLOY_FOLDER="dist/browser"
          else
            DEPLOY_FOLDER="dist"
          fi
          echo "Dossier de build détecté : $DEPLOY_FOLDER"
          cp "$DEPLOY_FOLDER/index.html" "$DEPLOY_FOLDER/404.html"
          touch "$DEPLOY_FOLDER/.nojekyll"
          echo "DEPLOY_FOLDER=$DEPLOY_FOLDER" >> $GITHUB_ENV

      - name: Déploiement sur la branche gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ env.DEPLOY_FOLDER }}
          branch: gh-pages
          clean-exclude: |
            pr-preview

  deploy-preview:
    name: Déploiement Preview (Pull Request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation des dépendances
        if: github.event.action != 'closed'
        run: npm install

      - name: Build de l'application
        if: github.event.action != 'closed'
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Préparer les fichiers SPA et nojekyll
        if: github.event.action != 'closed'
        run: |
          if [ -d "dist/browser" ]; then
            PREVIEW_FOLDER="dist/browser"
          else
            PREVIEW_FOLDER="dist"
          fi
          echo "Dossier de preview détecté : $PREVIEW_FOLDER"
          cp "$PREVIEW_FOLDER/index.html" "$PREVIEW_FOLDER/404.html"
          touch "$PREVIEW_FOLDER/.nojekyll"
          echo "PREVIEW_FOLDER=$PREVIEW_FOLDER" >> $GITHUB_ENV

      - name: Déployer ou supprimer la preview sur GitHub Pages
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ${{ env.PREVIEW_FOLDER }}
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          token: ${{ secrets.GITHUB_TOKEN }}
